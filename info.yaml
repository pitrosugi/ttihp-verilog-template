yaml_version: 6

project:
  name: "tt_um_pitrosugi_pdm_sc"
  owner: "pitrosugi"
  description: >
    PDM sigma-delta modulator, Class-D complementary driver with deadtime,
    switched-capacitor 2-phase non-overlap clock generator, 1-bit SDM CIC decimator,
    and SPI register/FIFO interface for Raspberry Pi Pico (UAC2 handled off-chip).
  foundry: "sky130"
  process: "SKY130A"
  tiles: 1
  top_module: "tt_um_sugiura_pdm_sc"

pinout:
  # TinyTapeout 標準入出力
  clk: "clk"         # 外部クロック（実クロック周波数はシャトルに準拠、パラメータで分周設定可）
  rst_n: "rst_n"
  ena: "ena"

  # 8 x input (ui_in[7:0]) - ここでは 1bit ΔΣ入力など
  ui_in:
    0: "sdm_in"      # 1-bit ΔΣ A/D のデジタル出力（外付けコンパレータから）
    1: "unused_in1"
    2: "unused_in2"
    3: "unused_in3"
    4: "unused_in4"
    5: "unused_in5"
    6: "unused_in6"
    7: "unused_in7"

  # 8 x output (uo_out[7:0]) - PDM と SC 制御などを出力
  uo_out:
    0: "pdm_out"     # 1-bit PDM (ΣΔ出力)
    1: "classd_hi"   # クラスD ハイサイド用（補完、デッドタイム付）
    2: "classd_lo"   # クラスD ローサイド用（補完、デッドタイム付）
    3: "phi1"        # SC用 2相非重複クロック φ1
    4: "phi2"        # SC用 2相非重複クロック φ2
    5: "sw0"         # 外付けアナログスイッチ等の制御
    6: "sw1"
    7: "sw2"

  # 8 x bidirectional (uio[7:0]) - SPI を割当て
  uio:
    0: "spi_sclk"    # in
    1: "spi_mosi"    # in
    2: "spi_miso"    # out
    3: "spi_cs_n"    # in
    4: "sw3"         # out（追加の制御線）
    5: "gpio5"       # reserve
    6: "gpio6"       # reserve
    7: "gpio7"       # reserve

constraints:
  voltage: "3v3"
  drive: "low"   # TinyTapeoutのI/Oドライブは小さめ（外付けドライバで受ける前提）
  notes: >
    Do NOT drive power stages directly. Use proper gate drivers / analog switches.
    uio_* are tri-stated unless configured as outputs in RTL.

documentation:
  interfaces:
    spi:
      mode: 0
      max_sclk_hint: "≤ 10 MHz (timing budget dependent on clk parameter)"
      write: "Reg writes and sample FIFO push"
      read: "Reg reads and capture of CIC-decimated samples"
  registers:
    - addr: 0x00
      name: VERSION
      desc: "Read-only version ID"
    - addr: 0x01
      name: CTRL
      desc: "bit0:enable, bit1:mute_pdm, bit2:classd_en, bit3:sc_en"
    - addr: 0x02
      name: CLKDIV_AUDIO
      desc: "Audio sample strobe divider (from clk) for 48k etc."
    - addr: 0x03
      name: PDM_OSR
      desc: "Oversample factor (pdm_clk = clk/(PDM_OSR))"
    - addr: 0x04
      name: DEADTIME
      desc: "Deadtime in pdm_clk cycles for class-D complementary"
    - addr: 0x05
      name: SC_DIV
      desc: "SC base divider (phi toggling rate)"
    - addr: 0x06
      name: SC_GAP
      desc: "Non-overlap gap cycles between phi1 and phi2"
    - addr: 0x10
      name: TX_FIFO
      desc: "Write 16-bit signed PCM (push LSB then MSB); triggers on MSB write"
    - addr: 0x11
      name: RX_DATA
      desc: "Read 16-bit signed PCM from CIC (LSB then MSB)"
    - addr: 0x12
      name: STATUS
      desc: "bit0:tx_empty, bit1:tx_full, bit2:rx_valid, bit3:rx_overrun"
